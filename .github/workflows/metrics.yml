name: Metrics

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  metrics:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Self-hosted isometric calendar + languages card. Uses GITHUB_TOKEN so
      # it does not depend on a METRICS_TOKEN PAT (that secret is optional).
      - name: Contribution calendar and languages
        env:
          GITHUB_TOKEN: ${{ secrets.METRICS_TOKEN || secrets.GITHUB_TOKEN }}
        run: python scripts/metrics.py --user "${{ github.repository_owner }}" --out assets

      - name: Commit if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/metrics.isocalendar.svg assets/metrics.languages.svg
          git diff --staged --quiet || git commit -m "chore: refresh contribution calendar"
          git push
